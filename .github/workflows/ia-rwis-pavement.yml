name: Iowa RWIS pavement temperatures
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create placefile
        run: python scripts/build_ia_rwis_pavement_placefile.py
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ia_rwis_pavement_placefile.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update Iowa RWIS pavement temperatures'
            git push
          fi
